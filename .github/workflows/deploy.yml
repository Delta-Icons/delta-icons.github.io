name: Deploy

on:
  push:
    branches:
    - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Download script
      run: |
        curl -sL https://github.com/Delta-Icons/linux/raw/master/install.sh > linux

    - name: Checkout Android icons
      uses: actions/checkout@v4
      with:
        repository: Delta-Icons/android
        path: android
        fetch-depth: 1
        sparse-checkout: app/src/main/res/drawable-nodpi

    - name: Prepare site and icon catalog
      run: |
        mkdir _site
        cp -r assets *.html linux _site/
        rm -rf _site/assets/img/icons
        mkdir -p _site/assets/img/icons
        find android/app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name '*.png' \
          ! -name 'ic_*' ! -name clock_bg.png ! -name clock_hour.png ! -name clock_minute.png \
          -exec cp -t _site/assets/img/icons -- {} +
        cd _site/assets/img/icons
        python3 - <<'PYTHON'
        import json
        from pathlib import Path

        icons = sorted(path.name for path in Path(".").glob("*.png"))
        if not icons:
            raise SystemExit("No gallery PNGs found")
        Path("icons.json").write_text(json.dumps(icons, separators=(",", ":")), encoding="utf-8")
        PYTHON

    - name: Upload contents to Artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
